name: CD - Multi-Environment Continuous Deployment

on:
  push:
    branches: [main]
    paths:
      - 'ingest/**'
      - 'dataflow/**'
      - 'dataform/**'
      - 'infra/**'
      - '.github/workflows/cd.yml'

permissions:
  contents: read
  id-token: write # Required for Workload Identity Federation (OIDC)

jobs:
  # =========================================================================
  # 1. DEVELOPMENT DEPLOYMENT
  # =========================================================================
  deploy-dev:
    name: Deploy to Development (dev)
    runs-on: ubuntu-latest
    environment: development
    env:
      GCP_PROJECT_ID: ${{ vars.DEV_GCP_PROJECT_ID || 'airlytics-dev-123456' }}
      WIF_PROVIDER: ${{ secrets.DEV_WIF_PROVIDER || 'projects/123456789/locations/global/workloadIdentityPools/github-pool/providers/github-provider' }}
      WIF_SERVICE_ACCOUNT: ${{ secrets.DEV_WIF_SA || 'airlytics-cd-sa@airlytics-dev-123456.iam.gserviceaccount.com' }}
      REGION: "europe-west1"
      TEMPLATE_IMAGE: "europe-west1-docker.pkg.dev/airlytics-dev-123456/airlytics/dataflow-template:latest"
      INGEST_IMAGE: "europe-west1-docker.pkg.dev/airlytics-dev-123456/airlytics/ingest:latest"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud via Workload Identity Federation (OIDC)
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.0"

      - name: Terraform Apply (dev)
        run: |
          cd infra/dev
          terraform init
          terraform apply -auto-approve -var="project_id=${{ env.GCP_PROJECT_ID }}"

      - name: Configure Docker for Google Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build & Push Ingestion Container
        run: |
          docker build -t ${{ env.INGEST_IMAGE }} -f ingest/Dockerfile .
          docker push ${{ env.INGEST_IMAGE }}

      - name: Build & Push Dataflow Flex Template
        run: |
          gcloud dataflow flex-template build gs://airlytics-dataflow-dev-${{ env.GCP_PROJECT_ID }}/templates/flight-pipeline.json \
            --image-gcr-path="${{ env.TEMPLATE_IMAGE }}" \
            --sdk-language="PYTHON" \
            --flex-template-base-image="gcr.io/dataflow-templates-base/python311-template-launcher-base:latest" \
            --metadata-file="dataflow/metadata.json" \
            --py-path="dataflow/pipeline.py" \
            --env="FLEX_TEMPLATE_PYTHON_PY_FILE=dataflow/pipeline.py"

      - name: Run Dataflow Streaming Job (dev)
        run: |
          gcloud dataflow flex-template run "airlytics-streaming-dev-$(date +%s)" \
            --template-file-gcs-location="gs://airlytics-dataflow-dev-${{ env.GCP_PROJECT_ID }}/templates/flight-pipeline.json" \
            --region="${{ env.REGION }}" \
            --max-workers=2 \
            --service-account-email="airlytics-dataflow-sa-dev@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
            --parameters \
              input_subscription="projects/${{ env.GCP_PROJECT_ID }}/subscriptions/dataflow-raw-flight-pings-dev-sub",\
              raw_table="${{ env.GCP_PROJECT_ID }}:raw_flights_dev.raw_pings",\
              late_table="${{ env.GCP_PROJECT_ID }}:raw_flights_dev.late_pings",\
              deadletter_table="${{ env.GCP_PROJECT_ID }}:raw_flights_dev.deadletter_pings",\
              flight_legs_table="${{ env.GCP_PROJECT_ID }}:curated_flights_dev.fact_flight_leg"

  # =========================================================================
  # 2. PRODUCTION DEPLOYMENT (Guarded by GitHub Environment Approval Gate)
  # =========================================================================
  deploy-prod:
    name: Deploy to Production (prod)
    needs: [deploy-dev]
    runs-on: ubuntu-latest
    environment: production # Requires manual approval in GitHub repository settings
    env:
      GCP_PROJECT_ID: ${{ vars.PROD_GCP_PROJECT_ID || 'airlytics-prod-123456' }}
      WIF_PROVIDER: ${{ secrets.PROD_WIF_PROVIDER || 'projects/987654321/locations/global/workloadIdentityPools/github-pool/providers/github-provider' }}
      WIF_SERVICE_ACCOUNT: ${{ secrets.PROD_WIF_SA || 'airlytics-cd-sa@airlytics-prod-123456.iam.gserviceaccount.com' }}
      REGION: "europe-west1"
      TEMPLATE_IMAGE: "europe-west1-docker.pkg.dev/airlytics-prod-123456/airlytics/dataflow-template:latest"
      INGEST_IMAGE: "europe-west1-docker.pkg.dev/airlytics-prod-123456/airlytics/ingest:latest"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud via Workload Identity Federation (OIDC)
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.0"

      - name: Terraform Apply (prod)
        run: |
          cd infra/prod
          terraform init
          terraform apply -auto-approve -var="project_id=${{ env.GCP_PROJECT_ID }}"

      - name: Configure Docker for Google Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build & Push Ingestion Container
        run: |
          docker build -t ${{ env.INGEST_IMAGE }} -f ingest/Dockerfile .
          docker push ${{ env.INGEST_IMAGE }}

      - name: Build & Push Dataflow Flex Template
        run: |
          gcloud dataflow flex-template build gs://airlytics-dataflow-prod-${{ env.GCP_PROJECT_ID }}/templates/flight-pipeline.json \
            --image-gcr-path="${{ env.TEMPLATE_IMAGE }}" \
            --sdk-language="PYTHON" \
            --flex-template-base-image="gcr.io/dataflow-templates-base/python311-template-launcher-base:latest" \
            --metadata-file="dataflow/metadata.json" \
            --py-path="dataflow/pipeline.py" \
            --env="FLEX_TEMPLATE_PYTHON_PY_FILE=dataflow/pipeline.py"

      - name: Run Dataflow Streaming Job (prod)
        run: |
          gcloud dataflow flex-template run "airlytics-streaming-prod-$(date +%s)" \
            --template-file-gcs-location="gs://airlytics-dataflow-prod-${{ env.GCP_PROJECT_ID }}/templates/flight-pipeline.json" \
            --region="${{ env.REGION }}" \
            --max-workers=2 \
            --service-account-email="airlytics-dataflow-sa-prod@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
            --parameters \
              input_subscription="projects/${{ env.GCP_PROJECT_ID }}/subscriptions/dataflow-raw-flight-pings-prod-sub",\
              raw_table="${{ env.GCP_PROJECT_ID }}:raw_flights_prod.raw_pings",\
              late_table="${{ env.GCP_PROJECT_ID }}:raw_flights_prod.late_pings",\
              deadletter_table="${{ env.GCP_PROJECT_ID }}:raw_flights_prod.deadletter_pings",\
              flight_legs_table="${{ env.GCP_PROJECT_ID }}:curated_flights_prod.fact_flight_leg"
