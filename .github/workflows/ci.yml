name: Local checks (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ingestion and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ingest/requirements.txt
          pip install pytest
      - name: Run ingestion tests
        env:
          PYTHONPATH: .
        run: pytest -q ingest/tests
